[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc2agent"
version = "0.1.0"
description = "Deterministic document-to-structured-knowledge pipeline for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "aspose-words-foss>=26.4.0",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
doc2agent = "doc2agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[dependency-groups]
dev = [
    "pytest-cov>=6.3.0",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
